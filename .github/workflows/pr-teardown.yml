name: Teardown PR Preview

on:
  pull_request:
    types: [closed]

jobs:
  teardown-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup SSH Tunnel for kubectl
        env:
          VM_IP: ${{ vars.VM_IP }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no -N -f -L 6443:127.0.0.1:6443 root@$VM_IP

      - name: Delete Kubernetes Namespace
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          VM_IP: ${{ vars.VM_IP }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml
          kubectl delete namespace pr-${PR_NUMBER} --ignore-not-found=true
